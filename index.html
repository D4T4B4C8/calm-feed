<title>My Calm Feed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--text:#0d0d0d;--muted:#6a6f6a;--line:#e6eae4;--green:#b9e6c3;--green-soft:#eef8f0;--on-green:#0d0d0d;--focus:#2e7d46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#121412;--text:#f3f5f1;--muted:#98a098;--line:#242823;--green:#b9e6c3;--green-soft:#16211a;--focus:#b9e6c3}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#121412;--text:#f3f5f1;--muted:#98a098;--line:#242823;--green:#b9e6c3;--green-soft:#16211a;--focus:#b9e6c3}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;
background-image:radial-gradient(60% 320px at 50% 0,var(--green-soft),transparent)}
main{max-width:600px;margin:0 auto;padding:64px 20px 90px}
h1{font-weight:300;font-size:clamp(2.2rem,8vw,3rem);letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
.dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--green);margin-left:.12em;vertical-align:baseline}
p.sub{color:var(--muted);margin:0 0 36px;max-width:32em;font-weight:400}
.row{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);transition:border-color .2s,box-shadow .2s}
.row:focus-within{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:1rem;padding:10px 0}
input::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer}
#add{border:0;border-radius:999px;padding:11px 24px;background:var(--green);color:var(--on-green);font-weight:600;transition:filter .2s}
#add:hover{filter:brightness(.96)}
button:focus-visible,.item a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
#msg{min-height:1.4em;margin:10px 0 0 18px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:.92rem;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:500}
.item{margin:28px 0;border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden}
.item header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:.92rem}
.item header a{color:var(--text);text-decoration:none;font-weight:500}
.item header a:hover{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:4px;text-decoration-thickness:2px}
.item header .x{border:0;background:none;color:var(--muted);font-size:.88rem;padding:4px 8px;border-radius:8px;transition:color .2s,background .2s}
.item header .x:hover{color:var(--text);background:var(--green-soft)}
iframe{width:100%;border:0;display:block;background:#fff}
.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>My Calm Feed<span class="dot"></span></h1>
<p class="sub">Only the pages you choose. No suggestions, no reels loop, no ads from strangers.</p>
<div class="row">
  <input id="inp" placeholder="Paste a page link, post link, or username" autocomplete="off" aria-label="Instagram link or username">
  <button id="add" type="button">Add</button>
</div>
<div id="msg" role="status"></div>
<div class="chips" id="chips"></div>
<div id="feed"></div>
</main>
<script>
var API='/.netlify/functions/data', KEY='calmfeed.v1', DONE='calmfeed.migrated';
var items=[], filter='all', busy=false, offline=false, lastSig='';
// Height of the profile header area inside an Instagram page embed.
// The page card is sized as header + two rows of 3 posts, so no white space shows below.
// If you still see white (or cut-off posts), change this number.
var PAGE_HEAD=159;
function note(t){document.getElementById('msg').textContent=t||'';}
function cache(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function local(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
async function fetchItems(){
  var r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('load');
  var s=await r.json();
  return Array.isArray(s.items)?s.items:[];
}
// Always start from the newest saved list, apply the change, then save it.
async function change(mutator){
  busy=true;
  try{
    items=await fetchItems();
    mutator();
    var r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:items})});
    if(!r.ok) throw new Error('save');
    lastSig=JSON.stringify(items); cache(); offline=false; note('');
    return true;
  }catch(e){
    note('Couldn’t save that. Check your connection and try again.');
    return false;
  }finally{busy=false;}
}
async function refresh(first){
  if(busy) return;
  var s;
  try{ s=await fetchItems(); }
  catch(e){
    offline=true;
    if(first){items=local(); render();}
    note('Couldn’t reach the server. Showing the last list saved on this device.');
    return;
  }
  if(first){
    var done; try{done=localStorage.getItem(DONE);}catch(e){}
    try{localStorage.setItem(DONE,'1');}catch(e){}
    var l=local();
    // One time: move a list that was only saved on this device up to the server.
    if(!s.length && l.length && !done){
      if(await change(function(){items=l;})){render();return;}
    }
  }
  if(offline){offline=false; note('');}
  var sig=JSON.stringify(s);
  if(first||sig!==lastSig){items=s; lastSig=sig; cache(); render();}
}
function parse(v){
  v=v.trim(); if(!v) return null;
  var m=v.match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|tv)\/([\w-]+)/i);
  if(m) return {type:'post',code:m[2],kind:m[1]=='p'?'p':m[1],user:'posts'};
  m=v.match(/instagram\.com\/([\w.]+)/i);
  var u=m?m[1]:v.replace(/^@/,'');
  if(/^[\w.]{1,30}$/.test(u) && !/^(p|reel|explore|accounts)$/i.test(u)) return {type:'page',user:u.toLowerCase()};
  return null;
}
async function add(){
  var inp=document.getElementById('inp'), r=parse(inp.value);
  if(!r){note('That doesn’t look like an Instagram link. Try a profile link, a post link, or a username.');return;}
  var id=r.type+':'+(r.code||r.user);
  if(items.some(function(i){return i.id===id})){note('Already added.');return;}
  var ok=await change(function(){
    if(!items.some(function(i){return i.id===id})){r.id=id; items.push(r);}
  });
  if(ok) inp.value='';
  render();
}
async function remove(id){
  await change(function(){items=items.filter(function(i){return i.id!==id});});
  if(filter!=='all' && !items.some(function(i){return i.user===filter}))filter='all';
  render();
}
function fit(){
  document.querySelectorAll('iframe[data-page]').forEach(function(fr){
    fr.style.height=Math.round(PAGE_HEAD+fr.clientWidth/3*2)+'px';
  });
}
function render(){
  var users=[]; items.forEach(function(i){if(users.indexOf(i.user)<0)users.push(i.user)});
  var c=document.getElementById('chips'); c.innerHTML='';
  if(users.length){
    var all=document.createElement('button'); all.type='button'; all.className='chip'+(filter==='all'?' on':''); all.textContent='All';
    all.onclick=function(){filter='all';render()}; c.appendChild(all);
    users.forEach(function(u){
      var d=document.createElement('button'); d.type='button'; d.className='chip'+(filter===u?' on':'');
      d.textContent=(u==='posts'?'Saved posts':'@'+u);
      d.onclick=function(){filter=u;render()}; c.appendChild(d);
    });
  }
  var f=document.getElementById('feed'); f.innerHTML='';
  var list=items.filter(function(i){return filter==='all'||i.user===filter});
  if(!list.length){f.innerHTML='<div class="empty">Your feed is empty. Paste a page above to begin.</div>';return;}
  list.forEach(function(i){
    var box=document.createElement('div'); box.className='item';
    var src;
    if(i.type==='page') src='https://www.instagram.com/'+i.user+'/embed';
    else src='https://www.instagram.com/'+i.kind+'/'+i.code+'/embed/captioned';
    var head=document.createElement('header');
    var l=document.createElement('a'); l.target='_blank'; l.rel='noopener';
    l.href=i.type==='page'?'https://www.instagram.com/'+i.user+'/':'https://www.instagram.com/'+i.kind+'/'+i.code+'/';
    l.textContent=i.type==='page'?'@'+i.user+' on Instagram':'Open post on Instagram';
    var x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='Remove'; x.onclick=function(){remove(i.id)};
    head.appendChild(l); head.appendChild(x);
    var fr=document.createElement('iframe'); fr.src=src; fr.loading='lazy'; fr.title=l.textContent;
    if(i.type==='page'){fr.setAttribute('scrolling','no'); fr.setAttribute('data-page','1');}
    else{fr.height=720; fr.setAttribute('scrolling','yes');}
    box.appendChild(head); box.appendChild(fr); f.appendChild(box);
  });
  fit();
}
document.getElementById('add').onclick=add;
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
window.addEventListener('resize',fit);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
setInterval(function(){refresh();},60000);
refresh(true);
</script>
